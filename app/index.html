<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#284d46"><meta name="color-scheme" content="light dark"><title>BookShelf</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><script type="module" src="./main.js"></script></head>
<body><header><h1>BookShelf</h1><button id="settings" aria-haspopup="dialog">データ管理</button></header><main><label for="search">蔵書を検索</label><input id="search" type="search" placeholder="タイトル・著者・ASIN" autocomplete="off"><p class="hint">空白区切りでAND検索</p><p id="counts" role="status"></p><p id="message" role="status" aria-live="polite">データを読み込み中…</p><ul id="results" aria-label="検索結果"></ul><button id="more" hidden>さらに50件表示</button></main>
<dialog id="management"><div class="dialog-head"><h2>データ管理</h2><button id="close-management" aria-label="データ管理を閉じる">閉じる</button></div><p id="summary"></p><p>JSONはこの端末内で処理・保存されます。</p><label for="file">蔵書JSONをインポート</label><input id="file" type="file" accept=".json,application/json"><p id="import-status" role="status" aria-live="polite"></p><button id="delete" class="danger">全データ削除</button><p class="hint">サイトデータの削除で蔵書は失われます。元のJSONは別途保管してください。</p></dialog>
<dialog id="detail" aria-labelledby="detail-heading"><div class="dialog-head"><h2 id="detail-heading">書籍詳細</h2><button id="close-detail">閉じる</button></div><section id="series-detail" hidden><h3 id="series-title"></h3><p id="series-count"></p><details open><summary>巻を選択</summary><ul id="volume-list" aria-label="巻一覧"></ul></details></section><div id="cover"><img id="cover-image" alt="" crossorigin="anonymous" referrerpolicy="no-referrer" hidden><p id="cover-status" role="status"></p></div><h3 id="detail-title"></h3><dl><dt>著者</dt><dd id="detail-author"></dd><dt>ASIN</dt><dd id="detail-asin"></dd></dl><a id="amazon" target="_blank" rel="noopener noreferrer">Amazonで開く</a></dialog></body></html>
